name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Android APK
        run: |
          chmod +x build/build_android.sh
          APP_VERSION="${GITHUB_SHA::7}" \
          APP_BUILDTIME="$(date -u +%Y.%m.%d)" \
          BUILD_ANDROID_APK=1 \
          bash build/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Ikemen-GO-Android-APK
          path: |
            bin/*.apk
            bin/libmain.so
            lib/*.so
          if-no-files-found: error
          retention-days: 7
